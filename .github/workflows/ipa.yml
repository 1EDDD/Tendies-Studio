name: Unsigned iPadOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen imagemagick

      - name: Generate offline starter assets
        run: bash Scripts/generate-starter-library.sh
      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned iPadOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project TendiesStudio.xcodeproj \
            -scheme TendiesStudio \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/TendiesStudio.app"
          test -d "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/export"
          mkdir -p "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/export"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          mkdir -p "$RUNNER_TEMP/Payload/TendiesStudio.app/StarterLibrary"
          cp -R Resources/StarterLibrary/*.png "$RUNNER_TEMP/Payload/TendiesStudio.app/StarterLibrary/"
          cp -R Resources/StarterLibrary/index.json "$RUNNER_TEMP/Payload/TendiesStudio.app/StarterLibrary/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/export/Tendies-Studio-iPadOS.ipa"
          unzip -t "$RUNNER_TEMP/export/Tendies-Studio-iPadOS.ipa" >/dev/null

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tendies-Studio-iPadOS-IPA
          path: ${{ runner.temp }}/export/Tendies-Studio-iPadOS.ipa
          if-no-files-found: error
          retention-days: 14
