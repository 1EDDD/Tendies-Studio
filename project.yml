name: TendiesStudio
options:
  bundleIdPrefix: com.1eddd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: 2
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_KEY_CFBundleDisplayName: Tendies Studio
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
      - UIInterfaceOrientationPortrait
      - UIInterfaceOrientationPortraitUpsideDown
      - UIInterfaceOrientationLandscapeLeft
      - UIInterfaceOrientationLandscapeRight
targets:
  TendiesStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/StarterLibrary/Aurora-Night.png
      - path: Resources/StarterLibrary/Ultraviolet-Glass.png
      - path: Resources/StarterLibrary/index.json
    info:
      path: Sources/Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 2
        PRODUCT_BUNDLE_IDENTIFIER: com.1eddd.tendiesstudio
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
